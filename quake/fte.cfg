// Configuracion de Zombies para Android (ejecutada al arrancar)
unbindall
bind menu        "toggleconsole"
bind volup       inc volume 0.1
bind voldown     inc volume -0.1

brightness       "0.3"
contrast         "1.1"
vid_conwidth     "0"
vid_conheight    "300"
vid_conautoscale "0"
scr_consize 0.4

sys_orientation sensorlandscape
crosshair 0
cl_nocsqc 0
sv_maxspeed 320
sv_aim 0
seta zm_looksens 0.22   // sensibilidad al arrastrar para apuntar (grados por unidad de pantalla)
cl_threadedphysics 0
volume 0.8
skill 1
maxplayers 1
deathmatch 0
coop 0

exec touch.cfg
map zombies
