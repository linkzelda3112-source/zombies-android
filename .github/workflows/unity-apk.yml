name: Compilar APK (Unity, opcional)

# Versión anterior en Unity. Solo se lanza a mano y necesita los secretos
# UNITY_EMAIL, UNITY_PASSWORD y UNITY_LICENSE (ver unity/README.md).
on:
  workflow_dispatch:

jobs:
  build:
    name: APK Android (Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          unityVersion: 2022.3.45f1
          buildMethod: BuildScript.Build
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: zombies-unity-apk
          path: build/Android/*.apk
